name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (RSpec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_development
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: rakamin_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY_BASE: ci_only_secret_key_base

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      # No schema is pre-created here on purpose. 20231201000000 creates an
      # unqualified `organizations` and only 20240101000000 creates the
      # ai_interview schema, so ai_interview must not exist yet or that first
      # table lands in the wrong schema and shadows public.organizations.
      - name: Prepare the test database
        working-directory: api
        run: bundle exec rails db:create db:migrate

      - name: RSpec
        working-directory: api
        run: bundle exec rspec

  web:
    name: web (Vitest + tsc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Vitest
        working-directory: web
        run: npm run test
